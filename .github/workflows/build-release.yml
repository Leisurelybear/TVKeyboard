name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TVKEYBOARD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TVKEYBOARD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TVKEYBOARD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TVKEYBOARD_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::TVKEYBOARD_KEYSTORE_BASE64 secret not set, APK will be debug-signed"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tvkeyboard-release.jks"
          {
            echo "SIGNING_ENABLED=true"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/tvkeyboard-release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Prepare release APK
        shell: bash
        run: |
          mkdir -p dist
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            cp app/build/outputs/apk/release/*.apk dist/TVKeyboard-$GITHUB_REF_NAME.apk
          else
            cp app/build/outputs/apk/release/*.apk dist/TVKeyboard-release.apk
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: TVKeyboard-release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view $GITHUB_REF_NAME >/dev/null 2>&1; then
            gh release upload $GITHUB_REF_NAME dist/*.apk --clobber
          else
            gh release create $GITHUB_REF_NAME dist/*.apk \
              --generate-notes \
              --title $GITHUB_REF_NAME
          fi
