name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Prepare release APK
        shell: bash
        run: |
          mkdir -p dist
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            cp app/build/outputs/apk/release/*.apk dist/TVKeyboard-$GITHUB_REF_NAME.apk
          else
            cp app/build/outputs/apk/release/*.apk dist/TVKeyboard-release.apk
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: TVKeyboard-release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view $GITHUB_REF_NAME >/dev/null 2>&1; then
            gh release upload $GITHUB_REF_NAME dist/*.apk --clobber
          else
            gh release create $GITHUB_REF_NAME dist/*.apk \
              --generate-notes \
              --title $GITHUB_REF_NAME
          fi
